const SESSIONS = [{"b":"Foundation Block","w":"WEEK 1","d":"Upper (Strength Focus)","ex":[["45\u00b0 Incline Barbell Press","N/A","2-3","2","6-8","~6-7","~7-8","3-5 min","45\u00b0 Incline DB Press","45\u00b0 Incline Machine Press","1 second pause at the bottom of each rep while maintaining tension on the pecs","https://www.youtube.com/watch?v=vqQ9ok0dEgk","https://www.youtube.com/watch?v=p2t9daxLpB8","https://youtu.be/b8fYnZ-usP0"],["Cable Crossover Ladder","N/A","1-2","2","8-10","~7-8","~8-9","1-2 min","Pec Deck","Bottom-Half DB Flye","Do one set with low cable position, one set with medium-height cable position, and one height with a high cable position. If you only have one or two sets, choose the one or two cable positions you prefer.","https://youtu.be/0TP9kVcWGic?si=5lWdSFfUA27mop9-","https://youtu.be/CI88L1VNvEs?si=UjPZ3Ep5QaYBM5rC","https://youtu.be/qJzc-iHKGdg?si=GGd61Dr4uoDUI9b6"],["Wide-Grip Pull-Up","N/A","1-2","2","8-10","~6-7","~7-8","2-3 min","Wide-Grip Lat Pulldown","Dual-Handle Lat Pulldown","1.5x shoulder width overhand grip. Slow 2-3 second negative. Feel your lats pulling apart on the way down.","https://youtu.be/yGnp0HU8BnA?si=g9lS7YfxwnBQ5gbR","https://youtu.be/IYXRrYXfVLc?si=8eUNzIQ9o7Y-XpSp","https://youtu.be/NwQ5Ch5t5Vk?si=JHztlva6LI2NPBDC"],["High-Cable Lateral Raise","N/A","1-2","2","8-10","~7-8","~8-9","1-2 min","High-Cable Cuffed Lateral Raise","Lean-In DB Lateral Raise","Focus on squeezing your lateral delt to move the weight.","https://youtu.be/MnMux3Wc0Ac?si=diOk1ZKwTwTa4Sx0","https://youtu.be/8m2jNHBP580?si=a4KGz2Dm0gRioyBG","https://www.youtube.com/watch?v=BmYuAG2j2co"],["Pendlay Deficit Row","N/A","1-2","2","6-8","~7-8","~8-9","2-3 min","Smith Machine Row","Single-Arm DB Row","Stand on a bumper plate. Focus on getting a big stretch and touch your stomach/chest on each rep!","https://youtu.be/MmuyHKYCLps?si=JK1d5szj5PIIbYYm","https://youtu.be/Wmivm40AV3Q?si=pAcxmzGxP16bt5I5","https://youtu.be/roKtfQZbxzg?si=x0BVOCTXzrksYhHL"],["Overhead Cable Triceps Extension (Bar)","N/A","1","2","8-10","~7-8","~8-9","1-2 min","Overhead Cable Triceps Extension (Rope)","DB Skull Crusher","Optionally pause for 0.5-1 second in the stretched aspect of each rep","https://youtu.be/9_I1PqZAjdA?si=hLmz2aLH05YfsUTF","https://youtu.be/GYoUoVNlbGc?si=mKlJH3mz_e7-RCu0","https://youtu.be/fbLTzgTKOR8?si=z-O6SNR4HG4rd09j"],["Bayesian Cable Curl","N/A","1","2","8-10","~7-8","~8-9","1-2 min","Seated Super- Bayesian High Cable Curl","Incline DB Stretch Curl","If you have a left-right bicep size imbalance, do these 1 arm at a time, starting with the weaker arm. Take the weaker arm to the listed RPE. Then match the reps with the other arm (stop once you've matched the reps, even if the RPE is lower). If you don't have a size imbalance, do these both arms at the same time.","https://youtu.be/CWH5J_7kzjM?si=FlPzreLDPHogRxve","https://youtu.be/jQ9rkfvAbIc?si=m1Q5OHGTNvhD6TZ9","https://youtu.be/Z0NIYS9nyoQ?si=PgrGaJLln2uZLfnY"]]},{"b":null,"w":"WEEK 1","d":"Rest Day","ex":[["Lying Leg Curl","N/A","2","2","8-10","~7-8","~8-9","1-2 min","Seated Leg Curl","Nordic Ham Curl","Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl.","https://youtu.be/sX4tGtcc62k?si=mparE5f2nb9KfXPl","https://youtu.be/yv0aAY7M1mk?si=Z1Cx7ih-vWTSTqq-","https://youtu.be/fzpYiRtzmFA?si=M3BGSywSskWqGRnE"],["Smith Machine Squat","N/A","2-4","2","6-8","~6-7","~7-8","3-5 min","DB Bulgarian Split Squat","High-Bar Back Squat","Once you are under the bar, set up your feet as you would a normal squat and then bring them forward ~3-6 inches. This will cause you to lean back into the bar slightly, allowing for a more upright squat, while also placing more tension on the quads. If your heels are raising at the bottom, you may need to bring your feet more forward. If your feet feel like they are slipping or your lower back is rounding at the bottom, try bringing your feet back a bit.","https://www.youtube.com/watch?v=J2D2J7RO_tA","https://youtu.be/htDXu61MPio?si=WNsXh0BmNMXONRHP","https://youtu.be/V-B_Y-OvOTQ?si=3cSY6hI1IDiedc8y"],["Barbell RDL","N/A","2-4","2","6-8","~6-7","~7-8","2-3 min","DB RDL","Snatch-Grip RDL","To keep tension on the hamstrings, stop about 75% of the way to full lockout on each rep (i.e. stay in the bottom 3/4 of the range of motion).","https://www.youtube.com/watch?v=3fJwfg51cv0","https://www.youtube.com/watch?v=VRwSgUoj7uI","https://www.youtube.com/watch?v=b8fmEaXHapU"],["Leg Extension","N/A","1-2","2","8-10","~7-8","~8-9","1-2 min","Reverse Nordic","Sissy Squat","Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","https://youtu.be/uFbNtqP966A?si=3mIG7OVH30gHjNhd","https://youtu.be/D-kqUKEQZZ0?si=1i2hWkoG06CDuFmq","https://youtu.be/eWAjlO4FWPQ?si=CaRzMpTB37IdGgpM"],["Standing Calf Raise","N/A","1-2","2","6-8","~7-8","~8-9","1-2 min","Seated Calf Raise","Leg Press Calf Press","1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","https://youtu.be/6lR2JdxUh7w?si=Q_4oyceNkI-WarRg","https://youtu.be/6pfj0G7VKdM?si=bXJmuLkyC3E3PYHW","https://youtu.be/S6DTPNZ_-F4?si=y3rx6TaVEuUONiI2"],["Cable Crunch","N/A","1","2","8-10","~7-8","~8-9","1-2 min","Decline Weighted Crunch","Machine Crunch","Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","https://youtu.be/epBrpaGHMcg?si=FMV9IKBOvBkuUOZM","https://youtu.be/ZheUsKqU81M?si=r3a6FT_AqWp1nq6L","https://youtu.be/K2yKEoazT3g?si=mLbXtOh8oUF8lcIs"]]},{"b":null,"w":"WEEK 1","d":"Pull (Hypertrophy Focus)","ex":[["Neutral-Grip Lat Pulldown","N/A","2-3","2","8-10","~6-7","~7-8","2-3 min","Neutral-Grip Pull- Up","Dual-Handle Lat Pulldown","Do these pulldowns with the handle more out in front of you, more like a cross between pullover and a pulldown. Focus on feeling your lats working more than the weight you're using.","https://youtu.be/lA4_1F9EAFU?si=5Bh19rDwBplX5QUz","https://youtu.be/b0ypSz63UGo?si=dMxuJGtxkR4jnUbb","https://youtu.be/NwQ5Ch5t5Vk?si=JHztlva6LI2NPBDC"],["Chest-Supported Machine Row","N/A","2-3","2","8-10","~6-7","~7-8","2-3 min","Chest-Supported T-Bar Row","Incline Chest- Supported DB Row","Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","https://youtu.be/ijsSiWSzYw0?si=ADBJRkNSajLiVayN","https://youtu.be/q8qlHwcuOtc?si=J-TyFYuv9rwi5VTy","https://youtu.be/okCWuhxJEvw?si=-Q9-BAJbFeebhfpF"],["Neutral-Grip Seated Cable Row","N/A","1-2","2","10-12","~7-8","~8-9","2-3 min","Helms Row","Meadows Row","Focus on squeezing your shoulder blades together, driving your elbows down and back.","https://youtu.be/hM7XHxQgvLk?si=NSpgHwt_kgLsKPBY","https://youtu.be/DjO2G9DIerQ?si=-mwu_fgJnonsBQVX","https://youtu.be/TwOkRqvcX_c?si=lACYBPtTFfzIMYDZ"],["1-Arm 45\u00b0 Cable Rear Delt Flye","N/A","1-2","2","10-12","~7-8","~8-9","1-2 min","Rope Face Pull","Reverse Pec Deck","Pause for 1-2 seconds in the squeeze of each rep. Contract the rear delts hard!","https://www.youtube.com/watch?v=6G5DmVaocGM","https://youtu.be/GhrVM-jPIEA?si=_qGmAZLOCDUWVHy_","https://youtu.be/Y8fb_rtEU_4?si=nwaICiwwS3TatSq1"],["Machine Shrug","N/A","2-3","2","10-12","~7-8","~8-9","1-2 min","Cable Paused Shrug-In","DB Shrug","Brief pause at the top of the bottom of ROM. Think about pulling your shoulders up to your ears!","https://youtu.be/ua0XuKwKQ9M?si=Y-kGNEq_riqAF2Tn","https://youtu.be/Hy6f1Lz_PiA?si=MTEbKv_uMCL6zvge","https://youtu.be/moFqLlptX7Q?si=vsQXeROXKVa3beB7"],["EZ-Bar Cable Curl","N/A","1","2","10-12","~7-8","~8-9","1-2 min","EZ-Bar Curl","DB Curl","Set up the cable at the lowest position. Maintain constant tension on the biceps. Slow, controlled reps!","https://youtu.be/ck1zjNTnFew?si=EgggtiVFxulCoYXU","https://youtu.be/ le Triceps Extension (Bar)","N/A","1","2","10-12","~7-8","~8-9","1-2 min","Overhead Cable Triceps Extension (Rope)","DB Skull Crusher","Optionally pause for 0.5-1 second in the stretched aspect of each rep","https://youtu.be/9_I1PqZAjdA?si=hLmz2aLH05YfsUTF","https://youtu.be/GYoUoVNlbGc?si=mKlJH3mz_e7-RCu0","https://youtu.be/fbLTzgTKOR8?si=z-O6SNR4HG4rd09j"],["Cable Triceps Kickback","N/A","1","1","12-15","N/A","~8-9","1-2 min","DB Triceps Kickback","Bench Dip","There are two ways you can do this: upright or bent over. Choose the one that feels more comfortable for you. The main thing is that when you're in the full squeeze, your shoulder should be positioned back behind your torso.","https://youtu.be/oRxTKRtP8RE?si=S_C_5SZAal_SIFBq","https://youtu.be/YdUUYFgpA7g?si=IiD6eODwVqDS3WlB","https://youtu.be/3CaIq8jZe18?si=ZWFiM0R-hqcvpiQj"],["Roman Chair Leg Raise","N/A","1-2","2","10-20","~7-8","~8-9","1-2 min","Hanging Leg Raise","Modified Candlestick","Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit the listed RPE with controlled form.","https://youtu.be/irOzFVqJ0IE?si=T1jsVXxw_GUhXrPX","https://youtu.be/rGqwkinWqYI?si=-ygKr5ZOwrYdG0fX","https://youtu.be/-XVRl8KU7x0?si=o46w1tp8fNYfD-gU"]]},{"b":null,"w":"WEEK 1","d":"Rest Day","ex":[["Leg Press","N/A","2-4","2","8-10","~6-7","~7-8","2-3 min","Smith Machine Static Lunge","DB Walking Lunge","Feet lower on the platform for more quad focus. Get as deep as you can without excessive back rounding. Control the negative and do a slight pause at the bottom of each rep.","https://youtu.be/1yKAQLVV_XI?si=G0wEZEbz8Kq9vFnF","https://youtu.be/SEjKxJGg_C8?si=I_mi9RO4vFVVhFER","https://youtu.be/BC_eDtrB-M4?si=lhut9GRQ9n9g82Mz"],["Seated Leg Curl","N/A","1-2","2","10-12","~7-8","~8-9","1-2 min","Lying Leg Curl","Nordic Ham Curl","Lean forward over the machine to get a maximum stretch in your hamstrings.","https://youtu.be/yv0aAY7M1mk?si=Z1Cx7ih-vWTSTqq-","https://yo ine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl.","https://youtu.be/sX4tGtcc62k?si=mparE5f2nb9KfXPl","https://youtu.be/yv0aAY7M1mk?si=Z1Cx7ih-vWTSTqq-","https://youtu.be/fzpYiRtzmFA?si=M3BGSywSskWqGRnE"],["Smith Machine Squat","Failure","2-4","3","6-8","~8-9","10","3-5 min","DB Bulgarian Split Squat","High-Bar Back Squat","Once you are under the bar, set up your feet as you would a normal squat and then bring them forward ~3-6 inches. This will cause you to lean back into the bar slightly, allowing for a more upright squat, while also placing more tension on the quads. If your heels are raising at the bottom, you may need to bring your feet more forward. If your feet feel like they are slipping or your lower back is rounding at the bottom, try bringing your feet back a bit.","https://www.youtube.com/watch?v=J2D2J7RO_tA","https://youtu.be/htDXu61MPio?si=WNsXh0BmNMXONRHP","https://youtu.be/V-B_Y-OvOTQ?si=3cSY6hI1IDiedc8y"],["Barbell RDL","Failure","2-4","3","6-8","~8-9","10","2-3 min","DB RDL","Snatch-Grip RDL","To keep tension on the hamstrings, stop about 75% of the way to full lockout on each rep (i.e. stay in the bottom 3/4 of the range of motion).","https://www.youtube.com/watch?v=3fJwfg51cv0","https://www.youtube.com/watch?v=VRwSgUoj7uI","https://www.youtube.com/watch?v=b8fmEaXHapU"],["Leg Extension","Failure","1-2","2","8-10","~8-9","10","1-2 min","Reverse Nordic","Sissy Squat","Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","https://youtu.be/uFbNtqP966A?si=3mIG7OVH30gHjNhd","https://youtu.be/D-kqUKEQZZ0?si=1i2hWkoG06CDuFmq","https://youtu.be/eWAjlO4FWPQ?si=CaRzMpTB37IdGgpM"],["Standing Calf Raise","Static Stretch (30s)","1-2","2","6-8","~8-9","10","1-2 min","Seated Calf Raise","Leg Press Calf Press","1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","https://youtu.be/6lR2JdxUh7w?si=Q_4oyceNkI-WarRg","https://youtu.be/6pfj0G7VKdM?si=bXJmuLkyC3E3PYHW","https://youtu.be/S6DTPNZ_-F4?si=y3rx6TaVEuUONiI2"],["Cable Crunch","Failure","1","2","8-10","~8-9","10","1-2 min","Decline Weighted Crunch","Machine Crunch","Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","https://youtu.be/epBrpaGHMcg?si=FMV9IKBOvBkuUOZM","https://youtu.be/ZheUsKqU81M?si=r3a6FT_AqWp1nq6L","https://youtu.be/K2yKEoazT3g?si=mLbXtOh8oUF8lcIs"]]},{"b":null,"w":"WEEK 4","d":"Pull (Hypertrophy Focus)","ex":[["Neutral-Grip Lat Pulldown","Failure","2-3","2","8-10","~8-9","10","2-3 min","Neutral-Grip Pull- Up","Dual-Handle Lat Pulldown","Do these pulldowns with the handle more out in front of you, more like a cross between pullover and a pulldown. Focus on feeling your lats working more than the weight you're using.","https://youtu.be/lA4_1F9EAFU?si=5Bh19rDwBplX5QUz","https://youtu.be/b0ypSz63UGo?si=dMxuJGtxkR4jnUbb","https://youtu.be/NwQ5Ch5t5Vk?si=JHztlva6LI2NPBDC"],["Chest-Supported Machine Row","Failure","2-3","3","8-10","~8-9","10","2-3 min","Chest-Supported T-Bar Row","Incline Chest- Supported DB Row","Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","https://youtu.be/ijsSiWSzYw0?si=ADBJRkNSajLiVayN","https://youtu.be/q8qlHwcuOtc?si=J-TyFYuv9rwi5VTy","https://youtu.be/okCWuhxJEvw?si=-Q9-BAJbFeebhfpF"],["Neutral-Grip Seated Cable Row","Failure + LLPs (Extend set)","1-2","2","10-12","~8-9","10","2-3 min","Helms Row","Meadows Row","Focus on squeezing your shoulder blades together, driving your elbows down and back.","https://youtu.be/hM7XHxQgvLk?si=NSpgHwt_kgLsKPBY","https://youtu.be/DjO2G9DIerQ?si=-mwu_fgJnonsBQVX","https://youtu.be/TwOkRqvcX_c?si=lACYBPtTFfzIMYDZ"],["1-Arm 45\u00b0 Cable Rear Delt Flye","Myo-reps","1-2","2" //youtu.be/oDKGCsTjAk8?si=6CA3mVlk1fYWb8Ek","https://youtu.be/fbLTzgTKOR8?si=z-O6SNR4HG4rd09j","https://youtu.be/R7f45Mv7yyg?si=xsSbcMbkSOuYetpO"],["Triceps Pressdown (Bar)","Myo-reps","1","3","15-20","~8-9","10","1-2 min","Triceps Pressdown (Rope)","DB Triceps Kickback","Focus on squeezing your triceps to move the weight.","https://youtu.be/o4eazahiXQw?si=L61XPqSVKpnjf1r1","https://youtu.be/bCa036rGtVU?si=egxwlHADiCBQGss7","https://youtu.be/YdUUYFgpA7g?si=IiD6eODwVqDS3WlB"],["Ab Wheel Rollout","Failure","1-2","3","12-15","~8-9","10","1-2 min","Swiss Ball Rollout","Long-Lever Plank","Don't just bend at your hips, use your abs to lower yourself down under control and pull yourself back up. If you don't have the core strength to get all the way extended at the bottom, try to progressively increase the ROM week to week.","https://youtu.be/gGTgyCU9gcg?si=2h_43OzMnRo5nVWU","https://youtu.be/FvekMyIs-yk?si=WE_SAmFUUdmsWGgL","https://youtu.be/9rFS1gg0vJM?si=ihh3GBLwr9TyBojo"]]},{"b":null,"w":"WEEK 12","d":"Rest Day","ex":[["Hack Squat","Failure","2-4","4","10-12","~8-9","10","2-3 min","Leg Press","DB Walking Lunge","Use a controlled negative (don't free fall) and then explode on the positive.","https://youtu.be/TWUnnDK8rck?si=NmqKbwgMcHmaDp6T","https://youtu.be/1yKAQLVV_XI?si=G0wEZEbz8Kq9vFnF","https://youtu.be/BC_eDtrB-M4?si=lhut9GRQ9n9g82Mz"],["Seated Leg Curl","Failure + LLPs (Extend set)","1-2","4","12-15","~8-9","10","1-2 min","Lying Leg Curl","Nordic Ham Curl","Lean forward over the machine to get a maximum stretch in your hamstrings.","https://youtu.be/yv0aAY7M1mk?si=Z1Cx7ih-vWTSTqq-","https://youtu.be/sX4tGtcc62k?si=mparE5f2nb9KfXPl","https://youtu.be/fzpYiRtzmFA?si=M3BGSywSskWqGRnE"],["Walking Lunge","Failure","2-3","2","10-12","~8-9","10","2-3 min","Smith Machine Static Lunge","DB Static Lunge","Take medium strides. Minimize contribution from the back leg.","https://youtu.be/BC_eDtrB-M4?si=j6tHLEbqdJRbGeTW","https://youtu.be/SEjKxJGg_C8?si=I_mi9RO4vFVVhFER","https://youtu.be/hci6iKFtTkg?si=R8PHuNMWbGOoTd9e"],["Leg Extension","Myo-reps","1-2","3","12-15","~8-9","10","1-2 min","Reverse Nordic","Sissy Squat","Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","https://youtu.be/uFbNtqP966A?si=3mIG7OVH30gHjNhd","https://youtu.be/D-kqUKEQZZ0?si=1i2hWkoG06CDuFmq","https://youtu.be/eWAjlO4FWPQ?si=CaRzMpTB37IdGgpM"],["Machine Hip Adduction","Failure","1-2","3","12-15","~8-9","10","1-2 min","Cable Hip Adduction","Copenhagen Hip Adduction","Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","https://youtu.be/FMSCZYu1JhE?si=iYXhWk9YxX6x5mcF","https://youtu.be/6GYTbv-LtV0?si=VygdtjQe61c9HjQG","https://youtu.be/QRLGyl5-i4k?si=23wQAlVoedInGcYN"],["Machine Hip Abduction","Failure","1-2","3","12-15","~8-9","10","1-2 min","Cable Hip Abduction","Lateral Band Walk","If possible, use pads to increase the range of motion on the machine. Lean forward and grab onto the machine rails to stretch the glutes further.","https://youtu.be/pozooPg6PBE?si=uVtC8JPKXvZKeVlE","https://youtu.be/552L1K3Rb_Q?si=bwLZLzHR0AHulO9I","https://youtu.be/sOYvvFPYdsU?si=QAdyWBV_5NAX2CtW"],["Standing Calf Raise","Static Stretch (30s)","1-2","3","12-15","~8-9","10","1-2 min","Seated Calf Raise","Leg Press Calf Press","1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","https://youtu.be/6lR2JdxUh7w?si=Q_4oyceNkI-WarRg","https://youtu.be/6pfj0G7VKdM?si=bXJmuLkyC3E3PYHW","https://youtu.be/S6DTPNZ_-F4?si=y3rx6TaVEuUONiI2"]]}];

const DAY_ACCENTS = {
  "Upper (Strength Focus)": "#2563eb",
  "Lower (Strength Focus)": "#2563eb",
  "Pull (Hypertrophy Focus)": "#0ea5e9",
  "Push (Hypertrophy Focus)": "#0ea5e9",
  "Legs (Hypertrophy Focus)": "#0ea5e9",
};

function fieldKey(sessionIdx, exIdx) {
  return sessionIdx + ":" + exIdx;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function maxSets(workingSetsStr) {
  const nums = (workingSetsStr.match(/\d+/g) || ["1"]).map(Number);
  return Math.max(...nums, 1);
}

function App() {
  const [sessionIdx, setSessionIdx] = useState(0);
  const [logs, setLogs] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [expandedNotes, setExpandedNotes] = useState({});
  const [expandedSubs, setExpandedSubs] = useState({});
  const [saveFlash, setSaveFlash] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const pos = await window.storage.get("abts-position");
        if (pos && pos.value) {
          const p = JSON.parse(pos.value);
          if (typeof p.sessionIdx === "number") setSessionIdx(p.sessionIdx);
        }
      } catch (e) {}
      try {
        const l = await window.storage.get("abts-logs");
        if (l && l.value) setLogs(JSON.parse(l.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set("abts-position", JSON.stringify({ sessionIdx })).catch(() => {});
  }, [sessionIdx, loaded]);

  const persistLogs = useCallback(async (next) => {
    setLogs(next);
    try {
      await window.storage.set("abts-logs", JSON.stringify(next));
      setSaveFlash(true);
      setTimeout(() => setSaveFlash(false), 900);
    } catch (e) {}
  }, []);

  const session = SESSIONS[sessionIdx];

  const currentEntry = useMemo(() => {
    const arr = logs[sessionIdx] || [];
    const today = todayStr();
    const existing = arr.find((e) => e.date === today);
    return existing || { date: today, sets: {} };
  }, [logs, sessionIdx]);

  const prevSessionIdx = sessionIdx - 5 >= 0 ? sessionIdx - 5 : null;
  const prevEntry = useMemo(() => {
    if (prevSessionIdx === null) return null;
    const arr = logs[prevSessionIdx] || [];
    return arr.length ? arr[arr.length - 1] : null;
  }, [logs, prevSessionIdx]);

  function updateSet(exIdx, setIdx, field, value) {
    const arr = logs[sessionIdx] ? [...logs[sessionIdx]] : [];
    const today = todayStr();
    let idx = arr.findIndex((e) => e.date === today);
    let entry;
    if (idx === -1) {
      entry = { date: today, sets: {} };
      arr.push(entry);
      idx = arr.length - 1;
    } else {
      entry = { ...arr[idx], sets: { ...arr[idx].sets } };
    }
    const setsForEx = entry.sets[exIdx] ? [...entry.sets[exIdx]] : [];
    while (setsForEx.length <= setIdx) setsForEx.push({ w: "", r: "" });
    setsForEx[setIdx] = { ...setsForEx[setIdx], [field]: value };
    entry.sets[exIdx] = setsForEx;
    arr[idx] = entry;
    const next = { ...logs, [sessionIdx]: arr };
    persistLogs(next);
  }

  function getSetVal(exIdx, setIdx, field) {
    const s = currentEntry.sets[exIdx];
    if (!s || !s[setIdx]) return "";
    return s[setIdx][field] || "";
  }

  function session_lookup(idx, exName) {
    if (idx === null) return -1;
    return SESSIONS[idx].ex.findIndex((e) => e[0] === exName);
  }

  function getPrevSetVal(exName, setIdx, field) {
    if (!prevEntry) return null;
    const exIdx = session_lookup(prevSessionIdx, exName);
    if (exIdx === -1) return null;
    const s = prevEntry.sets[exIdx];
    if (!s || !s[setIdx]) return null;
    return s[setIdx][field] || null;
  }

  const accent = DAY_ACCENTS[session.d] || "#2563eb";

  return (
    <div style={{ minHeight: "100vh", background: "#f5f8ff", color: "#0f172a", fontFamily: "'Helvetica Neue', Arial, sans-serif" }}>
      <style>{`
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
      `}</style>

      <div style={{ position: "sticky", top: 0, zIndex: 10, background: "#ffffff", borderBottom: "1px solid #e2e8f5", padding: "14px 16px 10px", boxShadow: "0 2px 10px rgba(37,99,235,0.06)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.12em", color: "#64748b", textTransform: "uppercase", fontWeight: 700 }}>{session.b}</div>
          <div style={{ fontSize: 11, color: saveFlash ? "#0ea5e9" : "#c7d2ec", transition: "color 0.3s", fontWeight: 600 }}>{saveFlash ? "Saved" : "\u00b7"}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 4 }}>
          <button
            onClick={() => setSessionIdx((i) => Math.max(0, i - 1))}
            disabled={sessionIdx === 0}
            style={navBtnStyle(sessionIdx === 0, accent)}
          >
            {"\u2039 Prev"}
          </button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 21, fontWeight: 800, color: accent }}>{session.w}</div>
            <div style={{ fontSize: 14, color: "#334155", fontWeight: 500 }}>{session.d}</div>
          </div>
          <button
            onClick={() => setSessionIdx((i) => Math.min(SESSIONS.length - 1, i + 1))}
            disabled={sessionIdx === SESSIONS.length - 1}
            style={navBtnStyle(sessionIdx === SESSIONS.length - 1, accent)}
          >
            {"Next \u203a"}
          </button>
        </div>
        <input
          type="range"
          min={0}
          max={SESSIONS.length - 1}
          value={sessionIdx}
          onChange={(e) => setSessionIdx(Number(e.target.value))}
          style={{ width: "100%", marginTop: 10, accentColor: accent }}
        />
      </div>

      <div style={{ padding: "12px 12px 80px" }}>
        {session.ex.map((exRow, exIdx) => {
          const [name, technique, warmup, working, reps, earlyRpe, lastRpe, rest, sub1, sub2, notes, videoUrl, sub1Url, sub2Url] = exRow;
          const sets = maxSets(working);
          const notesOpen = !!expandedNotes[fieldKey(sessionIdx, exIdx)];
          const subsOpen = !!expandedSubs[fieldKey(sessionIdx, exIdx)];
          return (
            <div key={exIdx} style={{ background: "#ffffff", border: "1px solid #e2e8f5", borderRadius: 12, padding: 14, marginBottom: 10, boxShadow: "0 1px 3px rgba(15,23,42,0.04)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#0f172a", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  <span>{name}</span>
                  {videoUrl && (
                    <a
                      href={videoUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      title="Watch demo video on YouTube"
                      style={{
                        display: "inline-flex", alignItems: "center", justifyContent: "center",
                        width: 24, height: 24, borderRadius: 12, background: accent, flexShrink: 0,
                        textDecoration: "none",
                      }}
                    >
                      <span style={{ width: 0, height: 0, borderTop: "5px solid transparent", borderBottom: "5px solid transparent", borderLeft: "7px solid white", marginLeft: 2 }} />
                    </a>
                  )}
                </div>
                <div style={{ fontSize: 11, color: "#64748b", whiteSpace: "nowrap", textAlign: "right", fontWeight: 600 }}>{rest}</div>
              </div>
              <div style={{ display: "flex", gap: 12, marginTop: 4, fontSize: 12, color: "#475569", flexWrap: "wrap" }}>
                <span>{reps} reps</span>
                <span>RPE {earlyRpe}{lastRpe && lastRpe !== earlyRpe ? " \u2192 " + lastRpe : ""}</span>
                {technique && technique !== "N/A" && <span style={{ color: accent, fontWeight: 600 }}>{technique}</span>}
                {warmup && warmup !== "0" && <span>{warmup} warm-up</span>}
              </div>

              <div style={{ marginTop: 10 }}>
                <div style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr", gap: 8, fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4, fontWeight: 700 }}>
                  <span></span><span>Weight (kg)</span><span>Reps</span>
                </div>
                {Array.from({ length: sets }).map((_, setIdx) => {
                  const prevW = getPrevSetVal(name, setIdx, "w");
                  const prevR = getPrevSetVal(name, setIdx, "r");
                  const hasPrev = prevW || prevR;
                  return (
                    <div key={setIdx} style={{ marginBottom: 8 }}>
                      <div style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr", gap: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "#94a3b8", fontWeight: 700 }}>{setIdx + 1}</div>
                        <input
                          type="number"
                          inputMode="decimal"
                          placeholder="kg"
                          value={getSetVal(exIdx, setIdx, "w")}
                          onChange={(e) => updateSet(exIdx, setIdx, "w", e.target.value)}
                          style={inputStyle}
                        />
                        <input
                          type="number"
                          inputMode="numeric"
                          placeholder="reps"
                          value={getSetVal(exIdx, setIdx, "r")}
                          onChange={(e) => updateSet(exIdx, setIdx, "r", e.target.value)}
                          style={inputStyle}
                        />
                      </div>
                      {hasPrev && (
                        <div style={{ display: "grid", gridTemplateColumns: "22px 1fr", gap: 8, marginTop: 2 }}>
                          <div></div>
                          <div style={{ fontSize: 11, color: "#0ea5e9", fontWeight: 600 }}>
                            Last week: {prevW || "\u2014"} kg \u00d7 {prevR || "\u2014"}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
                {prevEntry && session_lookup(prevSessionIdx, name) === -1 && (
                  <div style={{ fontSize: 10.5, color: "#94a3b8", marginTop: 2 }}>New exercise \u2014 no prior week to compare</div>
                )}
              </div>

              <div style={{ display: "flex", gap: 14, marginTop: 10 }}>
                {notes && (
                  <button onClick={() => setExpandedNotes((s) => ({ ...s, [fieldKey(sessionIdx, exIdx)]: !notesOpen }))} style={linkBtnStyle(accent)}>
                    {notesOpen ? "Hide cue" : "Cue"}
                  </button>
                )}
                {(sub1 || sub2) && (
                  <button onClick={() => setExpandedSubs((s) => ({ ...s, [fieldKey(sessionIdx, exIdx)]: !subsOpen }))} style={linkBtnStyle(accent)}>
                    {subsOpen ? "Hide subs" : "Substitutions"}
                  </button>
                )}
              </div>
              {notesOpen && <div style={{ fontSize: 12.5, color: "#334155", marginTop: 8, lineHeight: 1.5 }}>{notes}</div>}
              {subsOpen && (
                <div style={{ fontSize: 12.5, color: "#334155", marginTop: 8, lineHeight: 1.6 }}>
                  {sub1 && (
                    <div>
                      {"\u2022 "}
                      {sub1Url ? (
                        <a href={sub1Url} target="_blank" rel="noopener noreferrer" style={inlineLinkStyle(accent)}>{sub1}</a>
                      ) : sub1}
                    </div>
                  )}
                  {sub2 && (
                    <div>
                      {"\u2022 "}
                      {sub2Url ? (
                        <a href={sub2Url} target="_blank" rel="noopener noreferrer" style={inlineLinkStyle(accent)}>{sub2}</a>
                      ) : sub2}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function navBtnStyle(disabled, accent) {
  return {
    background: disabled ? "#f1f5f9" : "#eff6ff",
    border: "1px solid " + (disabled ? "#e2e8f0" : "#bfdbfe"),
    color: disabled ? "#cbd5e1" : accent,
    borderRadius: 9,
    padding: "8px 12px",
    fontSize: 13,
    fontWeight: 700,
    cursor: disabled ? "default" : "pointer",
    whiteSpace: "nowrap",
  };
}

const inputStyle = {
  background: "#f8fafc",
  border: "1px solid #dbe4f7",
  borderRadius: 8,
  padding: "9px 6px",
  color: "#0f172a",
  fontSize: 15,
  width: "100%",
  textAlign: "center",
  fontWeight: 600,
};

function linkBtnStyle(accent) {
  return {
    background: "transparent",
    border: "none",
    color: accent,
    fontSize: 12,
    fontWeight: 600,
    textDecoration: "underline",
    padding: 0,
    cursor: "pointer",
  };
}

function inlineLinkStyle(accent) {
  return {
    background: "transparent",
    border: "none",
    color: accent,
    fontSize: 12.5,
    fontWeight: 600,
    textDecoration: "underline",
    padding: 0,
    cursor: "pointer",
    font: "inherit",
  };
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
